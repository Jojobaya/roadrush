          EOF_RR

          cat > app/src/main/res/drawable/btn_gray.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FF546E7A" android:endColor="#FF263238" android:angle="270"/>
              <corners android:radius="14dp"/>
              <stroke android:width="1dp" android:color="#FF90A4AE"/>
          </shape>
          EOF_RR

          cat > app/src/main/res/drawable/panel_bg.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#EE0D1B2A" android:endColor="#EE1B263B" android:angle="270"/>
              <corners android:radius="20dp"/>
