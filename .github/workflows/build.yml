name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarını oluştur
        run: |
          set -e
          mkdir -p RoadRush && cd RoadRush

          cat > settings.gradle <<'EOF_RR'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RoadRush"
          include ':app'
          EOF_RR

          cat > build.gradle <<'EOF_RR'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_RR

          cat > gradle.properties <<'EOF_RR'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_RR

          mkdir -p app

          cat > app/build.gradle <<'EOF_RR'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.roadrush.game'
              compileSdk 35

              defaultConfig {
                  applicationId "com.roadrush.game"
                  minSdk 24
                  targetSdk 35
                  versionCode 6
                  versionName "5.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_RR

          mkdir -p app/src/main

          cat > app/src/main/AndroidManifest.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_RR

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Road Rush</string>
          </resources>
          EOF_RR

          cat > app/src/main/res/values/styles.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF_RR

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#FF2B2F3A" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M46,6h4v18h-4z M46,34h4v14h-4z" />
              <path android:fillColor="#FFE53935" android:pathData="M32,52h32v30h-32z" />
              <path android:fillColor="#FF263238" android:pathData="M37,58h22v10h-22z" />
              <path android:fillColor="#FF111111" android:pathData="M28,56h5v10h-5z M63,56h5v10h-5z M28,72h5v10h-5z M63,72h5v10h-5z" />
          </vector>
          EOF_RR

          cat > app/src/main/res/drawable/btn_blue.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FF2196F3" android:endColor="#FF1565C0" android:angle="270"/>
              <corners android:radius="14dp"/>
              <stroke android:width="1dp" android:color="#FF64B5F6"/>
          </shape>
          EOF_RR

          cat > app/src/main/res/drawable/btn_purple.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FF9C27B0" android:endColor="#FF6A1B9A" android:angle="270"/>
              <corners android:radius="14dp"/>
              <stroke android:width="1dp" android:color="#FFCE93D8"/>
          </shape>
          EOF_RR

          cat > app/src/main/res/drawable/btn_green.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FF43A047" android:endColor="#FF1B5E20" android:angle="270"/>
