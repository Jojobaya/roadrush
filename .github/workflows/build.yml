          # ============================================================
          #  GameRenderer.java  (DÜZELTİLMİŞ: pushMatrix/popMatrix kaldırıldı)
          # ============================================================
          cat > app/src/main/java/com/roadrush/game/GameRenderer.java <<'EOF_RR'
          package com.roadrush.game;

          import android.opengl.GLES20;
          import android.opengl.GLSurfaceView;
          import android.opengl.Matrix;
          import android.util.Log;

          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.FloatBuffer;
          import java.nio.ShortBuffer;
          import java.util.Random;

          import javax.microedition.khronos.egl.EGLConfig;
          import javax.microedition.khronos.opengles.GL10;

          public class GameRenderer implements GLSurfaceView.Renderer {

              public static final int READY = 0;
              public static final int PLAYING = 1;
              public static final int DEAD = 2;

              public static final int MODE_ENDLESS = 0;
              public static final int MODE_TIME_TRIAL = 1;

              public static final int PU_NITRO = 0;
              public static final int PU_SHIELD = 1;
              public static final int PU_SLOWMO = 2;
              public static final int PU_MAGNET = 3;
              public static final int PU_DOUBLE_GOLD = 4;
              public static final int PU_TIME = 5;
              public static final int PU_COUNT = 6;

              static final float[] OB_W = {1.9f, 0.6f, 0.9f, 1.15f, 2.2f};
              static final float[] OB_D = {0.5f, 0.5f, 1.0f, 2.2f, 2.4f};

              public interface Listener {
                  void onScore(int score);
                  void onState(int state, int score);
                  void onCheckpoint(int count, float timeLeft);
                  void onPowerUp(int type);
                  void onHaptic(int strength);
                  void onReturnToMenu();
              }

              static final float LANE_W = 2.2f;
              static final float MAX_X = 2.55f;
              static final float MAX_LAT = 8f;
              static final float BASE_SPEED = 22f;
              static final float MAX_SPEED = 58f;
              static final float SPAWN_Z = -115f;
              static final float PLAYER_HALF_W = 0.40f;
              static final float PLAYER_HALF_L = 0.85f;
              static final int MAX_OBS = 40;
              static final int MAX_PU = 6;
              static final int MAX_COIN = 24;
              static final int MAX_PARTS = 60;

              static final float[][] CAR_COLORS = {
                      {0.20f, 0.45f, 0.90f},
                      {0.95f, 0.75f, 0.10f},
                      {0.20f, 0.70f, 0.40f},
                      {0.80f, 0.80f, 0.85f},
                      {0.60f, 0.20f, 0.70f},
                      {0.85f, 0.30f, 0.20f}
              };

              static final float[][] PU_COLORS = {
                      {0.20f, 0.70f, 1.00f},
                      {0.30f, 1.00f, 0.40f},
                      {0.90f, 0.55f, 0.15f},
                      {1.00f, 0.30f, 0.60f},
                      {1.00f, 0.85f, 0.10f},
                      {0.30f, 0.85f, 0.95f}
              };

              public volatile float steer = 0f;
              private volatile boolean tapReq = false;

              private final Listener listener;

              public int state = READY;
              public int mode = MODE_ENDLESS;
              float speed = 10f;
              float targetSpeed = 10f;
              float dist = 0f;
              float scroll = 0f;
              float px = 0f;
              float vx = 0f;
              float spin = 0f;
              float spinDir = 1f;
              float crashT = 0f;
              float nextRow = 0f;
              int safeLane = 1;
              int lastScore = -1;
              float time = 0f;
              boolean returnMenuShown = false;

              float speedMult = 1f;
              float turnMult = 1f;
              float nitroCapacity = 3.5f;
              float shieldCapacity = 5f;

              float[] carBody = {0.90f, 0.12f, 0.12f};

              public int runGold = 0;

              public float timeLeft = 60f;
              float nextCheckpoint = 500f;
              int checkpointsPassed = 0;

              public float nitroTime = 0f;
              public float shieldTime = 0f;
              public float slowmoTime = 0f;
              public float magnetTime = 0f;
              public float doubleGoldTime = 0f;

              public int mapIdx = 0;

              final boolean[] oAct = new boolean[MAX_OBS];
              final float[] oX = new float[MAX_OBS];
              final float[] oZ = new float[MAX_OBS];
              final int[] oType = new int[MAX_OBS];
              final int[] oCol = new int[MAX_OBS];
              final int[] oDir = new int[MAX_OBS];
              final float[] oSpeed = new float[MAX_OBS];

              final boolean[] puAct = new boolean[MAX_PU];
              final float[] puX = new float[MAX_PU];
              final float[] puZ = new float[MAX_PU];
              final int[] puType = new int[MAX_PU];
              final float[] puSpin = new float[MAX_PU];

              final boolean[] coinAct = new boolean[MAX_COIN];
              final float[] coinX = new float[MAX_COIN];
              final float[] coinZ = new float[MAX_COIN];
              final float[] coinSpin = new float[MAX_COIN];

              final boolean[] partAct = new boolean[MAX_PARTS];
              final float[] partX = new float[MAX_PARTS];
              final float[] partY = new float[MAX_PARTS];
              final float[] partZ = new float[MAX_PARTS];
              final float[] partVX = new float[MAX_PARTS];
              final float[] partVY = new float[MAX_PARTS];
              final float[] partVZ = new float[MAX_PARTS];
              final float[] partLife = new float[MAX_PARTS];
              final float[] partCol = new float[MAX_PARTS * 3];

              private final Random rnd = new Random();
              private long lastNanos = 0L;

              private int program = 0;
              private int aPos, aNormal;
              private int uMVP, uModel, uColor, uGlow, uLight, uFogColor, uFogStart, uFogEnd;
              private FloatBuffer vertexBuf;
              private ShortBuffer indexBuf;
              private float aspect = 0.5f;

              private final float[] proj = new float[16];
              private final float[] view = new float[16];
              private final float[] vp = new float[16];
              private final float[] model = new float[16];
              private final float[] mvp = new float[16];
              private final float[] ident = new float[16];
              private final float[] base = new float[16];
              // İkon çizimi için geçici matris (pushMatrix yok, manuel yönetiyoruz)
              private final float[] iconMat = new float[16];

              public GameRenderer(Listener listener) {
                  this.listener = listener;
                  Matrix.setIdentityM(ident, 0);
              }

              public void tap() { tapReq = true; }

              public void configureForPlayer(int carIdx, int motorLvl, int frenLvl, int nitroLvl, int zirhLvl) {
                  carBody = Cars.BODY[carIdx];
                  float baseSpeed = Cars.SPEED_MULT[carIdx];
                  float baseTurn = Cars.TURN_MULT[carIdx];
                  speedMult = baseSpeed * (1f + motorLvl * 0.05f);
                  turnMult = baseTurn * (1f + frenLvl * 0.07f);
                  nitroCapacity = 3.5f + nitroLvl * 1.0f;
                  shieldCapacity = 5f + zirhLvl * 1.2f + Cars.SHIELD_BONUS[carIdx];
              }

              private void handleTap() {
                  if (state == DEAD && crashT > 0.7f) {
                      if (!returnMenuShown) {
                          returnMenuShown = true;
                          if (listener != null) listener.onReturnToMenu();
                      }
                  }
              }

              public void startGame() {
                  for (int i = 0; i < MAX_OBS; i++) oAct[i] = false;
                  for (int i = 0; i < MAX_PU; i++) puAct[i] = false;
                  for (int i = 0; i < MAX_COIN; i++) coinAct[i] = false;
                  for (int i = 0; i < MAX_PARTS; i++) partAct[i] = false;
                  dist = 0f;
                  px = 0f;
                  vx = 0f;
                  spin = 0f;
                  crashT = 0f;
                  nextRow = 0f;
                  safeLane = 1;
                  speed = BASE_SPEED * 0.5f;
                  targetSpeed = BASE_SPEED;
                  lastScore = -1;
                  timeLeft = 60f;
                  nextCheckpoint = 500f;
                  checkpointsPassed = 0;
                  nitroTime = 0f;
                  shieldTime = 0f;
                  slowmoTime = 0f;
                  magnetTime = 0f;
                  doubleGoldTime = 0f;
                  runGold = 0;
                  returnMenuShown = false;
                  state = PLAYING;
                  if (listener != null) listener.onState(PLAYING, 0);
              }

              void step(float dt) {
                  time += dt;
                  if (tapReq) { tapReq = false; handleTap(); }

                  if (state == READY) {
                      targetSpeed = 12f;
                  } else if (state == PLAYING) {
                      targetSpeed = BASE_SPEED + dist / 55f;
                      if (targetSpeed > MAX_SPEED) targetSpeed = MAX_SPEED;
                      targetSpeed *= speedMult;
                      if (nitroTime > 0f) targetSpeed *= 1.6f;
                      if (slowmoTime > 0f) targetSpeed *= 0.55f;
                  } else {
                      targetSpeed = speed * (float) Math.exp(-2.0f * dt);
                      crashT += dt;
                  }

                  float maxAccel = 8f * dt;
                  float diff = targetSpeed - speed;
                  if (diff > maxAccel) diff = maxAccel;
                  else if (diff < -maxAccel) diff = -maxAccel;
                  speed += diff;
                  if (speed < 3f) speed = 3f;

                  scroll += speed * dt;

                  if (nitroTime > 0f) nitroTime -= dt;
                  if (shieldTime > 0f) shieldTime -= dt;
                  if (slowmoTime > 0f) slowmoTime -= dt;
                  if (magnetTime > 0f) magnetTime -= dt;
                  if (doubleGoldTime > 0f) doubleGoldTime -= dt;

                  if (state != DEAD) {
                      float target = steer * MAX_LAT * turnMult;
                      vx += (target - vx) * Math.min(1f, 12f * dt);
                      px += vx * dt;
                      if (px > MAX_X) { px = MAX_X; if (vx > 0f) vx = 0f; }
                      else if (px < -MAX_X) { px = -MAX_X; if (vx < 0f) vx = 0f; }
                  } else {
                      vx *= (float) Math.exp(-4f * dt);
                      spin += spinDir * 600f * (float) Math.exp(-3f * crashT) * dt;
                  }

                  if (state == PLAYING) {
                      dist += speed * dt;

                      if (mode == MODE_TIME_TRIAL) {
                          timeLeft -= dt;
                          if (timeLeft <= 0f) { crash(); return; }
                      }

                      float d = Math.min(1f, dist / 4000f);

                      nextRow -= speed * dt;
                      if (nextRow <= 0f) {
                          spawnRow(d);
                          nextRow = Math.max(18f - d * 6f, speed * (1.0f - d * 0.3f))
                                  + rnd.nextFloat() * (10f - d * 4f);
                      }

                      if (rnd.nextFloat() < 0.015f) spawnPowerUp();
                      if (rnd.nextFloat() < 0.75f) spawnCoinLine();
                  }

                  if (state != READY) {
                      for (int i = 0; i < MAX_OBS; i++) {
                          if (!oAct[i]) continue;
                          float rel = oDir[i] < 0 ? (speed + oSpeed[i]) : (speed - oSpeed[i]);
                          oZ[i] += rel * dt;
                          if (oZ[i] - OB_D[oType[i]] * 0.5f > 12f) oAct[i] = false;
                      }
                  }

                  for (int i = 0; i < MAX_PU; i++) {
                      if (!puAct[i]) continue;
                      puZ[i] += speed * dt;
                      puSpin[i] += dt * 3f;
                      if (state == PLAYING
                              && Math.abs(px - puX[i]) < 1.1f
                              && Math.abs(puZ[i]) < 1.6f) {
                          applyPowerUp(puType[i]);
                          puAct[i] = false;
                      }
                      if (puZ[i] > 12f) puAct[i] = false;
                  }

                  float coinRangeX = magnetTime > 0f ? 3.5f : 0.9f;
                  float coinRangeZ = magnetTime > 0f ? 4.5f : 1.2f;
                  for (int i = 0; i < MAX_COIN; i++) {
                      if (!coinAct[i]) continue;
                      coinZ[i] += speed * dt;
                      coinSpin[i] += dt * 5f;
                      if (state == PLAYING
                              && Math.abs(px - coinX[i]) < coinRangeX
                              && Math.abs(coinZ[i]) < coinRangeZ) {
                          coinAct[i] = false;
                          int gain = doubleGoldTime > 0f ? 2 : 1;
                          runGold += gain;
                          spawnSparkles(coinX[i], 0.8f, coinZ[i], 6, 1f, 0.85f, 0.1f);
                      }
                      if (coinZ[i] > 12f) coinAct[i] = false;
                  }

                  if (state == PLAYING && shieldTime <= 0f) {
                      for (int i = 0; i < MAX_OBS; i++) {
                          if (!oAct[i]) continue;
                          if (Math.abs(px - oX[i]) < PLAYER_HALF_W + OB_W[oType[i]] * 0.5f
                                  && Math.abs(oZ[i]) < PLAYER_HALF_L + OB_D[oType[i]] * 0.5f) {
                              crash();
                              break;
                          }
                      }
                  }

                  for (int i = 0; i < MAX_PARTS; i++) {
                      if (!partAct[i]) continue;
                      partLife[i] -= dt;
                      if (partLife[i] <= 0f) { partAct[i] = false; continue; }
                      partX[i] += partVX[i] * dt;
                      partY[i] += partVY[i] * dt;
                      partZ[i] += partVZ[i] * dt;
                      partVY[i] -= 9.8f * dt;
                      if (partY[i] < 0.05f) { partY[i] = 0.05f; partVY[i] *= -0.4f; partVX[i] *= 0.7f; partVZ[i] *= 0.7f; }
                  }

                  if (state == PLAYING) {
                      int sc = score();
                      if (sc != lastScore) {
                          lastScore = sc;
                          if (listener != null) listener.onScore(sc);
                      }
                  }
              }

              int score() { return (int) (dist / 2f); }

              private void crash() {
                  state = DEAD;
                  crashT = 0f;
                  spinDir = rnd.nextBoolean() ? 1f : -1f;
                  spawnSparkles(px, 0.5f, 0f, 40, 1f, 0.7f, 0.15f);
                  spawnSparkles(px, 0.6f, 0.3f, 20, 1f, 0.9f, 0.4f);
                  if (listener != null) listener.onHaptic(2);
                  if (listener != null) listener.onState(DEAD, score());
              }

              private void applyPowerUp(int type) {
                  switch (type) {
                      case PU_NITRO: nitroTime = nitroCapacity; break;
                      case PU_SHIELD: shieldTime = shieldCapacity; break;
                      case PU_SLOWMO: slowmoTime = 4.0f; break;
                      case PU_MAGNET: magnetTime = 6.0f; break;
                      case PU_DOUBLE_GOLD: doubleGoldTime = 8.0f; break;
                      case PU_TIME: timeLeft += 10f; break;
                  }
                  if (listener != null) listener.onPowerUp(type);
              }

              private void spawnRow(float d) {
                  int lane = safeLane + (rnd.nextInt(3) - 1);
                  if (lane < 0) lane = 0;
                  if (lane > 2) lane = 2;
                  safeLane = lane;

                  boolean both = rnd.nextFloat() < (0.25f + d * 0.55f);
                  int single = -1;
                  if (!both) {
                      single = rnd.nextInt(2);
                      if (single >= safeLane) single++;
                  }
                  for (int l = 0; l < 3; l++) {
                      if (l == safeLane) continue;
                      if (!both && l != single) continue;
                      int type = pickObstacleType(d);
                      addObstacle((l - 1) * LANE_W, type);
                  }
              }

              private int pickObstacleType(float diff) {
                  float r = rnd.nextFloat();
                  if (r < 0.20f) return 0;
                  if (r < 0.35f) return 1;
                  if (r < 0.50f) return 2;
                  if (r < 0.75f) return 3;
                  return 4;
              }

              private void addObstacle(float x, int type) {
                  for (int i = 0; i < MAX_OBS; i++) {
                      if (oAct[i]) continue;
                      oAct[i] = true;
                      oX[i] = x;
                      oZ[i] = SPAWN_Z;
                      oType[i] = type;
                      oCol[i] = rnd.nextInt(CAR_COLORS.length);
                      if (type == 0 || type == 1 || type == 2) {
                          oDir[i] = +1;
                          oSpeed[i] = 0f;
                      } else {
                          oDir[i] = rnd.nextBoolean() ? -1 : +1;
                          oSpeed[i] = 4f + rnd.nextFloat() * 8f;
                      }
                      return;
                  }
              }

              private void spawnPowerUp() {
                  for (int i = 0; i < MAX_PU; i++) {
                      if (puAct[i]) continue;
                      puAct[i] = true;
                      int lane = rnd.nextInt(3);
                      if (lane == safeLane) lane = (lane + 1) % 3;
                      puX[i] = (lane - 1) * LANE_W;
                      puZ[i] = SPAWN_Z;
                      if (mode == MODE_TIME_TRIAL && rnd.nextFloat() < 0.5f) {
                          puType[i] = PU_TIME;
                      } else {
                          puType[i] = rnd.nextInt(PU_COUNT);
                      }
                      puSpin[i] = rnd.nextFloat() * 6.28f;
                      return;
                  }
              }

              private void spawnCoinLine() {
                  int lane = rnd.nextInt(3);
                  if (lane == safeLane) lane = (lane + 1) % 3;
                  float x = (lane - 1) * LANE_W;
                  int count = 1 + rnd.nextInt(3);
                  float z = SPAWN_Z;
                  for (int c = 0; c < count; c++) {
                      boolean placed = false;
                      for (int i = 0; i < MAX_COIN; i++) {
                          if (coinAct[i]) continue;
                          coinAct[i] = true;
                          coinX[i] = x;
                          coinZ[i] = z;
                          coinSpin[i] = rnd.nextFloat() * 6.28f;
                          placed = true;
                          break;
                      }
                      if (!placed) return;
                      z += 4f;
                  }
              }

              private void spawnSparkles(float x, float y, float z, int count,
                                         float cr, float cg, float cb) {
                  for (int n = 0; n < count; n++) {
                      for (int i = 0; i < MAX_PARTS; i++) {
                          if (partAct[i]) continue;
                          partAct[i] = true;
                          partX[i] = x + (rnd.nextFloat() - 0.5f) * 0.5f;
                          partY[i] = y + rnd.nextFloat() * 0.5f;
                          partZ[i] = z + (rnd.nextFloat() - 0.5f) * 0.5f;
                          partVX[i] = (rnd.nextFloat() - 0.5f) * 8f;
                          partVY[i] = rnd.nextFloat() * 6f + 2f;
                          partVZ[i] = (rnd.nextFloat() - 0.5f) * 8f;
                          partLife[i] = 0.4f + rnd.nextFloat() * 0.7f;
                          partCol[i * 3] = cr * (0.7f + rnd.nextFloat() * 0.3f);
                          partCol[i * 3 + 1] = cg * (0.7f + rnd.nextFloat() * 0.3f);
                          partCol[i * 3 + 2] = cb * (0.7f + rnd.nextFloat() * 0.3f);
                          break;
                      }
                  }
              }

              private static final String VERTEX_SRC =
                      "attribute vec3 aPos;\n" +
                      "attribute vec3 aNormal;\n" +
                      "uniform mat4 uMVP;\n" +
                      "uniform mat4 uModel;\n" +
                      "uniform vec3 uLight;\n" +
                      "uniform float uFogStart;\n" +
                      "uniform float uFogEnd;\n" +
                      "varying float vLight;\n" +
                      "varying float vFog;\n" +
                      "void main() {\n" +
                      "  vec3 n = normalize((uModel * vec4(aNormal, 0.0)).xyz);\n" +
                      "  vLight = 0.45 + 0.55 * max(dot(n, normalize(uLight)), 0.0);\n" +
                      "  gl_Position = uMVP * vec4(aPos, 1.0);\n" +
                      "  vFog = clamp((gl_Position.w - uFogStart) / (uFogEnd - uFogStart), 0.0, 1.0);\n" +
                      "}\n";

              private static final String FRAGMENT_SRC =
                      "precision mediump float;\n" +
                      "varying float vLight;\n" +
                      "varying float vFog;\n" +
                      "uniform vec4 uColor;\n" +
                      "uniform vec3 uFogColor;\n" +
                      "uniform float uGlow;\n" +
                      "void main() {\n" +
                      "  vec3 c = uColor.rgb * mix(vLight, 1.0, uGlow);\n" +
                      "  c = mix(c, uFogColor, vFog);\n" +
                      "  gl_FragColor = vec4(c, 1.0);\n" +
                      "}\n";

              @Override
              public void onSurfaceCreated(GL10 gl, EGLConfig config) {
                  lastNanos = 0L;
                  program = createProgram(VERTEX_SRC, FRAGMENT_SRC);
                  aPos = GLES20.glGetAttribLocation(program, "aPos");
                  aNormal = GLES20.glGetAttribLocation(program, "aNormal");
                  uMVP = GLES20.glGetUniformLocation(program, "uMVP");
                  uModel = GLES20.glGetUniformLocation(program, "uModel");
                  uColor = GLES20.glGetUniformLocation(program, "uColor");
                  uGlow = GLES20.glGetUniformLocation(program, "uGlow");
                  uLight = GLES20.glGetUniformLocation(program, "uLight");
                  uFogColor = GLES20.glGetUniformLocation(program, "uFogColor");
                  uFogStart = GLES20.glGetUniformLocation(program, "uFogStart");
                  uFogEnd = GLES20.glGetUniformLocation(program, "uFogEnd");
                  buildCube();
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST);
              }

              @Override
              public void onSurfaceChanged(GL10 gl, int width, int height) {
                  GLES20.glViewport(0, 0, width, height);
                  aspect = (float) width / (float) Math.max(1, height);
              }

              @Override
              public void onDrawFrame(GL10 gl) {
                  long now = System.nanoTime();
                  float dt = lastNanos == 0L ? 0f : (now - lastNanos) / 1e9f;
                  lastNanos = now;
                  if (dt > 0.05f) dt = 0.05f;
                  step(dt);
                  render();
              }

              private void buildCube() {
                  float[] v = {
                          0.5f, -0.5f, -0.5f, 1, 0, 0,   0.5f, 0.5f, -0.5f, 1, 0, 0,
                          0.5f, 0.5f, 0.5f, 1, 0, 0,     0.5f, -0.5f, 0.5f, 1, 0, 0,
                          -0.5f, -0.5f, 0.5f, -1, 0, 0,  -0.5f, 0.5f, 0.5f, -1, 0, 0,
                          -0.5f, 0.5f, -0.5f, -1, 0, 0,  -0.5f, -0.5f, -0.5f, -1, 0, 0,
                          -0.5f, 0.5f, -0.5f, 0, 1, 0,   -0.5f, 0.5f, 0.5f, 0, 1, 0,
                          0.5f, 0.5f, 0.5f, 0, 1, 0,     0.5f, 0.5f, -0.5f, 0, 1, 0,
                          -0.5f, -0.5f, 0.5f, 0, -1, 0,  -0.5f, -0.5f, -0.5f, 0, -1, 0,
                          0.5f, -0.5f, -0.5f, 0, -1, 0,  0.5f, -0.5f, 0.5f, 0, -1, 0,
                          -0.5f, -0.5f, 0.5f, 0, 0, 1,   0.5f, -0.5f, 0.5f, 0, 0, 1,
                          0.5f, 0.5f, 0.5f, 0, 0, 1,     -0.5f, 0.5f, 0.5f, 0, 0, 1,
                          0.5f, -0.5f, -0.5f, 0, 0, -1,  -0.5f, -0.5f, -0.5f, 0, 0, -1,
                          -0.5f, 0.5f, -0.5f, 0, 0, -1,  0.5f, 0.5f, -0.5f, 0, 0, -1
                  };
                  short[] idx = new short[36];
                  for (int f = 0; f < 6; f++) {
                      int o = f * 4;
                      idx[f * 6] = (short) o;
                      idx[f * 6 + 1] = (short) (o + 1);
                      idx[f * 6 + 2] = (short) (o + 2);
                      idx[f * 6 + 3] = (short) o;
                      idx[f * 6 + 4] = (short) (o + 2);
                      idx[f * 6 + 5] = (short) (o + 3);
                  }
                  vertexBuf = ByteBuffer.allocateDirect(v.length * 4).order(ByteOrder.nativeOrder()).asFloatBuffer();
                  vertexBuf.put(v).position(0);
                  indexBuf = ByteBuffer.allocateDirect(idx.length * 2).order(ByteOrder.nativeOrder()).asShortBuffer();
                  indexBuf.put(idx).position(0);
              }

              private void box(float[] b, float lx, float ly, float lz,
                               float sx, float sy, float sz,
                               float r, float g, float bl, float glow) {
                  System.arraycopy(b, 0, model, 0, 16);
                  Matrix.translateM(model, 0, lx, ly, lz);
                  Matrix.scaleM(model, 0, sx, sy, sz);
                  Matrix.multiplyMM(mvp, 0, vp, 0, model, 0);
                  GLES20.glUniformMatrix4fv(uMVP, 1, false, mvp, 0);
                  GLES20.glUniformMatrix4fv(uModel, 1, false, model, 0);
                  GLES20.glUniform4f(uColor, r, g, bl, 1f);
                  GLES20.glUniform1f(uGlow, glow);
                  GLES20.glDrawElements(GLES20.GL_TRIANGLES, 36, GLES20.GL_UNSIGNED_SHORT, indexBuf);
              }

              private void render() {
                  if (program == 0) return;

                  float[] sky = Maps.SKY[mapIdx];
                  GLES20.glClearColor(sky[0], sky[1], sky[2], 1f);
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT | GLES20.GL_DEPTH_BUFFER_BIT);
                  GLES20.glUseProgram(program);

                  float fov = (float) Math.toDegrees(2.0 * Math.atan(3.6 / (8.5 * aspect)));
                  if (fov < 55f) fov = 55f;
                  if (fov > 95f) fov = 95f;
                  fov += Math.max(0f, (speed - BASE_SPEED)) * 0.18f;
                  Matrix.perspectiveM(proj, 0, fov, aspect, 0.1f, 200f);

                  float shake = state == DEAD ? 0.35f * (float) Math.exp(-5f * crashT) : 0f;
                  float cx = px * 0.6f + (float) Math.sin(time * 70f) * shake;
                  float cy = 4.0f + (float) Math.cos(time * 83f) * shake * 0.6f;
                  Matrix.setLookAtM(view, 0, cx, cy, 8.0f, cx, 0.5f, -10f, 0f, 1f, 0f);
                  Matrix.multiplyMM(vp, 0, proj, 0, view, 0);

                  GLES20.glUniform3f(uLight, 0.4f, 1.0f, 0.6f);
                  GLES20.glUniform3f(uFogColor, sky[0], sky[1], sky[2]);
                  GLES20.glUniform1f(uFogStart, 45f);
                  GLES20.glUniform1f(uFogEnd, 150f);

                  vertexBuf.position(0);
                  GLES20.glVertexAttribPointer(aPos, 3, GLES20.GL_FLOAT, false, 24, vertexBuf);
                  GLES20.glEnableVertexAttribArray(aPos);
                  vertexBuf.position(3);
                  GLES20.glVertexAttribPointer(aNormal, 3, GLES20.GL_FLOAT, false, 24, vertexBuf);
                  GLES20.glEnableVertexAttribArray(aNormal);
                  indexBuf.position(0);

                  drawEnvironment();
                  drawObstacles();
                  drawPowerUps();
                  drawCoins();
                  drawPlayer();
                  drawParticles();
              }

              private void drawEnvironment() {
                  float[] gA = Maps.GROUND_A[mapIdx];
                  float[] gB = Maps.GROUND_B[mapIdx];
                  float[] rd = Maps.ROAD[mapIdx];

                  final float gp = 10f;
                  float off = scroll % gp;
                  int f = (int) (scroll / gp);
                  for (int i = -1; i <= 18; i++) {
                      boolean a = (((i + f) & 1) == 0);
                      float z = -i * gp + off;
                      if (a) box(ident, 0, -0.1f, z, 120f, 0.2f, gp, gA[0], gA[1], gA[2], 0f);
                      else box(ident, 0, -0.1f, z, 120f, 0.2f, gp, gB[0], gB[1], gB[2], 0f);
                  }
                  box(ident, 0, 0f, -90f, 6.6f, 0.2f, 220f, rd[0], rd[1], rd[2], 0f);
                  box(ident, -3.0f, 0.12f, -90f, 0.12f, 0.04f, 220f, 0.95f, 0.95f, 0.95f, 0f);
                  box(ident, 3.0f, 0.12f, -90f, 0.12f, 0.04f, 220f, 0.95f, 0.95f, 0.95f, 0f);
                  final float dp = 8f;
                  off = scroll % dp;
                  for (int i = -1; i < 17; i++) {
                      float z = -i * dp + off;
                      box(ident, -1.1f, 0.12f, z, 0.14f, 0.04f, 3f, 0.95f, 0.95f, 0.85f, 0f);
                      box(ident, 1.1f, 0.12f, z, 0.14f, 0.04f, 3f, 0.95f, 0.95f, 0.85f, 0f);
                  }
                  final float cp = 4f;
                  off = scroll % cp;
                  f = (int) (scroll / cp);
                  for (int i = -2; i < 32; i++) {
                      boolean a = (((i + f) & 1) == 0);
                      float z = -i * cp + off;
                      float r = a ? 0.88f : 0.95f;
                      float g = a ? 0.15f : 0.95f;
                      float b = a ? 0.15f : 0.95f;
                      if (mapIdx == 1) { r = 0.95f; g = 0.95f; b = 0.95f; }
                      box(ident, -3.45f, 0.05f, z, 0.35f, 0.2f, cp, r, g, b, 0f);
                      box(ident, 3.45f, 0.05f, z, 0.35f, 0.2f, cp, r, g, b, 0f);
                  }

                  final float tp = 14f;
                  off = scroll % tp;
                  f = (int) (scroll / tp);
                  for (int i = -1; i < 11; i++) {
                      int id = i + f;
                      float z = -i * tp + off;
                      for (int s = -1; s <= 1; s += 2) {
                          int h = ((id * 73856093) ^ (s * 19349663)) >>> 3;
                          h &= 0xFF;
                          if (h % 5 == 0) continue;
                          float x = s * (5.8f + (h % 3) * 1.7f);
                          float th = 1.0f + (h % 4) * 0.35f;
                          if (mapIdx == 2) {
                              box(ident, x, 1.2f, z, 0.4f, 2.4f, 0.4f, 0.25f, 0.55f, 0.20f, 0f);
                              box(ident, x + 0.4f, 1.4f, z, 0.35f, 0.15f, 0.35f, 0.25f, 0.55f, 0.20f, 0f);
                          } else if (mapIdx == 1) {
                              box(ident, x, th * 0.5f, z, 0.3f, th, 0.3f, 0.35f, 0.25f, 0.15f, 0f);
                              box(ident, x, th + 0.8f, z, 1.5f, 1.6f, 1.5f, 0.10f, 0.35f, 0.15f, 0f);
                              box(ident, x, th + 1.5f, z, 1.2f, 0.3f, 1.2f, 0.95f, 0.95f, 1.0f, 0f);
                          } else {
                              box(ident, x, th * 0.5f, z, 0.3f, th, 0.3f, 0.45f, 0.30f, 0.15f, 0f);
                              box(ident, x, th + 0.8f, z, 1.5f, 1.6f, 1.5f, 0.15f, 0.45f + (h % 3) * 0.05f, 0.18f, 0f);
                          }
                      }
                  }
              }

              private void drawObstacles() {
                  for (int i = 0; i < MAX_OBS; i++) {
                      if (!oAct[i]) continue;
                      Matrix.setIdentityM(base, 0);
                      Matrix.translateM(base, 0, oX[i], 0f, oZ[i]);
                      if (oDir[i] < 0) Matrix.rotateM(base, 0, 180f, 0f, 1f, 0f);
                      switch (oType[i]) {
                          case 0: drawBarrier(base); break;
                          case 1: drawCone(base); break;
                          case 2: drawBarrel(base); break;
                          case 3: drawTrafficCar(base, CAR_COLORS[oCol[i]]); break;
                          default: drawTruck(base, CAR_COLORS[oCol[i]]); break;
                      }
                  }
              }

              private void drawBarrier(float[] b) {
                  box(b, -0.8f, 0.3f, 0f, 0.12f, 0.6f, 0.12f, 0.35f, 0.35f, 0.38f, 0f);
                  box(b, 0.8f, 0.3f, 0f, 0.12f, 0.6f, 0.12f, 0.35f, 0.35f, 0.38f, 0f);
                  box(b, 0f, 0.8f, 0f, 1.9f, 0.5f, 0.14f, 0.96f, 0.96f, 0.96f, 0f);
                  for (int k = 0; k < 4; k++) {
                      box(b, -0.72f + k * 0.48f, 0.8f, 0f, 0.24f, 0.5f, 0.16f, 0.88f, 0.12f, 0.12f, 0f);
                  }
              }

              private void drawCone(float[] b) {
                  box(b, 0f, 0.05f, 0f, 0.6f, 0.1f, 0.6f, 0.15f, 0.15f, 0.15f, 0f);
                  box(b, 0f, 0.35f, 0f, 0.45f, 0.55f, 0.45f, 1.0f, 0.45f, 0.05f, 0f);
                  box(b, 0f, 0.30f, 0f, 0.5f, 0.12f, 0.5f, 1.0f, 1.0f, 1.0f, 0f);
                  box(b, 0f, 0.20f, 0f, 0.53f, 0.12f, 0.53f, 1.0f, 1.0f, 1.0f, 0f);
              }

              private void drawBarrel(float[] b) {
