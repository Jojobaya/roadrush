              <stroke android:width="1dp" android:color="#FF81C784"/>
          </shape>
          EOF_RR

          cat > app/src/main/res/drawable/btn_orange.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FFFB8C00" android:endColor="#FFE65100" android:angle="270"/>
