              <stroke android:width="1dp" android:color="#FFFFB74D"/>
          </shape>
          EOF_RR

          cat > app/src/main/res/drawable/btn_red.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#FFE53935" android:endColor="#FFB71C1C" android:angle="270"/>
              <corners android:radius="14dp"/>
