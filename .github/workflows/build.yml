                  float dt = lastNanos == 0L ? 0f : (now - lastNanos) / 1e9f;
                  lastNanos = now;
                  angle += dt * 45f;

                  GLES20.glClearColor(0.05f, 0.08f, 0.16f, 1f);
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT | GLES20.GL_DEPTH_BUFFER_BIT);
                  GLES20.glUseProgram(program);

                  Matrix.perspectiveM(proj, 0, 35f, aspect, 0.1f, 50f);
                  float ry = (float) Math.toRadians(angle);
                  float cx = (float) Math.sin(ry) * 6f;
                  float cz = (float) Math.cos(ry) * 6f;
