name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarını oluştur
        run: |
          set -e
          mkdir -p RoadRush && cd RoadRush

          cat > settings.gradle <<'EOF_RR'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RoadRush"
          include ':app'
          EOF_RR

          cat > build.gradle <<'EOF_RR'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_RR

          cat > gradle.properties <<'EOF_RR'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_RR

          mkdir -p app

          cat > app/build.gradle <<'EOF_RR'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.roadrush.game'
              compileSdk 35

              defaultConfig {
                  applicationId "com.roadrush.game"
                  minSdk 24
                  targetSdk 35
                  versionCode 3
                  versionName "3.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_RR

          mkdir -p app/src/main

          cat > app/src/main/AndroidManifest.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_RR

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Road Rush</string>
          </resources>
          EOF_RR

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_RR'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp" android:height="96dp"
              android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#FF2B2F3A" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M46,6h4v18h-4z M46,34h4v14h-4z" />
              <path android:fillColor="#FFE53935" android:pathData="M32,52h32v30h-32z" />
              <path android:fillColor="#FF263238" android:pathData="M37,58h22v10h-22z" />
              <path android:fillColor="#FF111111" android:pathData="M28,56h5v10h-5z M63,56h5v10h-5z M28,72h5v10h-5z M63,72h5v10h-5z" />
          </vector>
          EOF_RR

          mkdir -p app/src/main/java/com/roadrush/game

          # =====================================================================
          #  SAVE.java — Kayıt yöneticisi (altın, araba, upgrade, isim)
          # =====================================================================
          cat > app/src/main/java/com/roadrush/game/Save.java <<'EOF_RR'
          package com.roadrush.game;

          import android.content.SharedPreferences;

          /**
           * Tüm kalıcı verilerin tek noktadan yönetimi:
           *  - Kullanıcı adı
           *  - Altın miktarı
           *  - Sahip olunan arabalar (5 adet)
           *  - Seçili araba
           *  - Upgrade seviyeleri (motor, fren, nitro, zırh)
           *  - En iyi skorlar (isim + skor + mod)
           */
          public class Save {

              public static final int CAR_COUNT = 5;
              public static final int UPGRADE_COUNT = 4;   // motor, fren, nitro, zirh
              public static final int MAX_UPGRADE = 3;     // seviye 1-3
              public static final int MAX_SCORES = 5;

              // -------- Kullanıcı Adı --------
              public static String getName(SharedPreferences p) {
                  return p.getString("username", "Sofor");
              }
              public static void setName(SharedPreferences p, String name) {
                  if (name == null) name = "Sofor";
                  name = name.trim();
                  if (name.isEmpty()) name = "Sofor";
                  if (name.length() > 14) name = name.substring(0, 14);
                  p.edit().putString("username", name).apply();
              }

              // -------- Altın --------
              public static int getGold(SharedPreferences p) {
                  return p.getInt("gold", 0);
              }
              public static void addGold(SharedPreferences p, int amount) {
                  p.edit().putInt("gold", getGold(p) + amount).apply();
              }
              public static boolean spendGold(SharedPreferences p, int amount) {
                  if (getGold(p) < amount) return false;
                  p.edit().putInt("gold", getGold(p) - amount).apply();
                  return true;
              }

              // -------- Arabalar --------
              public static boolean ownsCar(SharedPreferences p, int idx) {
                  return idx == 0 || p.getBoolean("car_" + idx, false);
              }
              public static void unlockCar(SharedPreferences p, int idx) {
                  p.edit().putBoolean("car_" + idx, true).apply();
              }
              public static int getSelectedCar(SharedPreferences p) {
                  return p.getInt("selected_car", 0);
              }
              public static void selectCar(SharedPreferences p, int idx) {
                  if (ownsCar(p, idx)) p.edit().putInt("selected_car", idx).apply();
              }

              // -------- Upgrades --------
              public static int getUpgrade(SharedPreferences p, int idx) {
                  return p.getInt("upg_" + idx, 0);
              }
              public static void setUpgrade(SharedPreferences p, int idx, int level) {
                  p.edit().putInt("upg_" + idx, level).apply();
              }

              // -------- Skor Tablosu --------
              /** Yeni skoru ekler. Yerleştiği sırayı döner (0-4) veya -1. */
              public static int addScore(SharedPreferences p, String name, int score, int mode) {
                  if (score <= 0) return -1;
                  int[] scores = new int[MAX_SCORES];
                  String[] names = new String[MAX_SCORES];
                  int[] modes = new int[MAX_SCORES];
                  for (int i = 0; i < MAX_SCORES; i++) {
                      scores[i] = p.getInt("s_score_" + i, 0);
                      names[i] = p.getString("s_name_" + i, "-");
                      modes[i] = p.getInt("s_mode_" + i, 0);
                  }
                  int pos = -1;
                  for (int i = 0; i < MAX_SCORES; i++) {
                      if (score > scores[i]) { pos = i; break; }
                  }
                  if (pos == -1) return -1;
                  for (int i = MAX_SCORES - 1; i > pos; i--) {
                      scores[i] = scores[i - 1];
                      names[i] = names[i - 1];
                      modes[i] = modes[i - 1];
                  }
                  scores[pos] = score;
                  names[pos] = name;
                  modes[pos] = mode;
                  SharedPreferences.Editor e = p.edit();
                  for (int i = 0; i < MAX_SCORES; i++) {
                      e.putInt("s_score_" + i, scores[i]);
                      e.putString("s_name_" + i, names[i]);
                      e.putInt("s_mode_" + i, modes[i]);
                  }
                  e.apply();
                  return pos;
              }

              public static int[] getScores(SharedPreferences p) {
                  int[] a = new int[MAX_SCORES];
                  for (int i = 0; i < MAX_SCORES; i++) a[i] = p.getInt("s_score_" + i, 0);
                  return a;
              }
              public static String[] getScoreNames(SharedPreferences p) {
                  String[] a = new String[MAX_SCORES];
                  for (int i = 0; i < MAX_SCORES; i++) a[i] = p.getString("s_name_" + i, "-");
                  return a;
              }
              public static int[] getScoreModes(SharedPreferences p) {
                  int[] a = new int[MAX_SCORES];
                  for (int i = 0; i < MAX_SCORES; i++) a[i] = p.getInt("s_mode_" + i, 0);
                  return a;
              }
              public static int best(SharedPreferences p) {
                  return p.getInt("s_score_0", 0);
              }
          }
          EOF_RR

          # =====================================================================
          #  Cars.java — 5 araba tanımı (renk, hız, dönüş, fiyat)
          # =====================================================================
          cat > app/src/main/java/com/roadrush/game/Cars.java <<'EOF_RR'
          package com.roadrush.game;

          /**
           * 5 farklı araba.
           * Her araba: isim, fiyat, gövde rengi, kabin rengi, hız çarpanı, dönüş çarpanı
           */
          public class Cars {

              public static final String[] NAMES = {
                      "Kirmizi Spor",
                      "Mavi Yarış",
                      "Siyah Hayalet",
                      "Sari Simsek",
                      "Yesil Dev"
              };

              public static final int[] PRICES = {0, 500, 1500, 3000, 6000};

              // body color (RGB)
              public static final float[][] BODY = {
                      {0.90f, 0.12f, 0.12f},
                      {0.12f, 0.40f, 0.90f},
                      {0.08f, 0.08f, 0.10f},
                      {1.00f, 0.85f, 0.10f},
                      {0.15f, 0.65f, 0.25f}
              };

              // hız çarpanı (1.0 = normal)
              public static final float[] SPEED_MULT = {1.00f, 1.10f, 1.15f, 1.25f, 0.90f};

              // dönüş çarpanı (yanal hız)
              public static final float[] TURN_MULT = {1.00f, 1.15f, 1.05f, 1.20f, 0.85f};

              // kalkan bonusu (saniye) — Yeşil Dev için
              public static final float[] SHIELD_BONUS = {0f, 0f, 0f, 0f, 1.5f};

              public static boolean canAfford(android.content.SharedPreferences p, int idx) {
                  return Save.getGold(p) >= PRICES[idx];
              }
          }
          EOF_RR

          # =====================================================================
          #  MainActivity.java — Menü, isim, garaj, modifiye, skor tablosu
          # =====================================================================
          cat > app/src/main/java/com/roadrush/game/MainActivity.java <<'EOF_RR'
          package com.roadrush.game;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.opengl.GLSurfaceView;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity implements GameRenderer.Listener {

              private GLSurfaceView glView;
              private GameRenderer renderer;
              private TextView scoreText;
              private TextView hudText;
              private TextView msgText;
              private LinearLayout menuLayout;
              private SharedPreferences prefs;
              private Vibrator vib;
              private int selectedMode = GameRenderer.MODE_ENDLESS;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  prefs = getSharedPreferences("roadrush", MODE_PRIVATE);
                  vib = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  float d = getResources().getDisplayMetrics().density;

                  renderer = new GameRenderer(this);
                  glView = new GLSurfaceView(this);
                  glView.setEGLContextClientVersion(2);
                  glView.setEGLConfigChooser(8, 8, 8, 8, 24, 0);
                  glView.setRenderer(renderer);
                  glView.setRenderMode(GLSurfaceView.RENDERMODE_CONTINUOUSLY);
                  glView.setOnTouchListener((v, e) -> {
                      int action = e.getActionMasked();
                      if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_POINTER_DOWN) {
                          renderer.tap();
                      }
                      if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                          renderer.steer = 0f;
                          return true;
                      }
                      int skip = action == MotionEvent.ACTION_POINTER_UP ? e.getActionIndex() : -1;
                      float mid = v.getWidth() / 2f;
                      boolean left = false, right = false;
                      for (int i = 0; i < e.getPointerCount(); i++) {
                          if (i == skip) continue;
                          if (e.getX(i) < mid) left = true; else right = true;
                      }
                      renderer.steer = (right ? 1f : 0f) - (left ? 1f : 0f);
                      return true;
                  });

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  root.addView(glView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  scoreText = new TextView(this);
                  scoreText.setTextColor(Color.WHITE);
                  scoreText.setTextSize(30f);
                  scoreText.setTypeface(Typeface.DEFAULT_BOLD);
                  scoreText.setShadowLayer(6f, 0f, 2f, Color.BLACK);
                  scoreText.setText("0 m");
                  FrameLayout.LayoutParams sp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.CENTER_HORIZONTAL);
                  sp.topMargin = (int) (56 * d);
                  root.addView(scoreText, sp);

                  hudText = new TextView(this);
                  hudText.setTextColor(0xFFFFD54F);
                  hudText.setTextSize(16f);
                  hudText.setTypeface(Typeface.DEFAULT_BOLD);
                  hudText.setShadowLayer(6f, 0f, 2f, Color.BLACK);
                  FrameLayout.LayoutParams hp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.END);
                  hp.topMargin = (int) (60 * d);
                  hp.rightMargin = (int) (16 * d);
                  root.addView(hudText, hp);

                  msgText = new TextView(this);
                  msgText.setTextColor(Color.WHITE);
                  msgText.setTextSize(20f);
                  msgText.setTypeface(Typeface.DEFAULT_BOLD);
                  msgText.setGravity(Gravity.CENTER);
                  msgText.setShadowLayer(6f, 0f, 2f, Color.BLACK);
                  msgText.setBackgroundColor(0xAA000000);
                  int pad = (int) (20 * d);
                  msgText.setPadding(pad, pad, pad, pad);
                  FrameLayout.LayoutParams mp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER);
                  root.addView(msgText, mp);

                  ScrollView menuScroll = new ScrollView(this);
                  menuLayout = new LinearLayout(this);
                  menuLayout.setOrientation(LinearLayout.VERTICAL);
                  menuLayout.setGravity(Gravity.CENTER_HORIZONTAL);
                  menuScroll.addView(menuLayout);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER);
                  lp.topMargin = (int) (260 * d);
                  root.addView(menuScroll, lp);

                  setContentView(root);
                  askNameIfNeeded();
                  showMainMenu();
                  hideSystemUi();
              }

              // ---------------- İsim ----------------

              private void askNameIfNeeded() {
                  if (prefs.contains("username")) return;
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("Adin ne?");
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_TEXT);
                  et.setHint("Ornek: Ahmet");
                  b.setView(et);
                  b.setCancelable(false);
                  b.setPositiveButton("TAMAM", (d, w) -> {
                      Save.setName(prefs, et.getText().toString());
                      showMainMenu();
                  });
                  b.show();
              }

              // ---------------- Menü ----------------

              private void showMainMenu() {
                  renderer.state = GameRenderer.READY;
                  msgText.setText("ROAD RUSH\n\nHos geldin, " + Save.getName(prefs) + "!");
                  msgText.setVisibility(View.VISIBLE);
                  scoreText.setVisibility(View.GONE);
                  menuLayout.removeAllViews();

                  addButton("SONSUZ SURUS", 0xCC1E88E5, () -> {
                      selectedMode = GameRenderer.MODE_ENDLESS;
                      startGame();
                  });
                  addButton("ZAMAN YARISI (60sn)", 0xCC1E88E5, () -> {
                      selectedMode = GameRenderer.MODE_TIME_TRIAL;
                      startGame();
                  });
                  addButton("POLIS KOVALAMACASI", 0xCC1E88E5, () -> {
                      selectedMode = GameRenderer.MODE_HOT_PURSUIT;
                      startGame();
                  });
                  addButton("GARAJ (" + Save.getGold(prefs) + " altin)", 0xCC6A1B9A, this::openGarage);
                  addButton("MODIFIYE", 0xCC00695C, this::openUpgrade);
                  addButton("SKOR TABLOSU", 0xCCEF6C00, this::openScoreboard);
                  addButton("ISMI DEGISTIR", 0xCC37474F, this::changeName);

                  updateHud();
              }

              private void addButton(String label, int bgColor, Runnable action) {
                  TextView b = new TextView(this);
                  b.setText(label);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(18f);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setGravity(Gravity.CENTER);
                  b.setBackgroundColor(bgColor);
                  int p = (int) (14 * getResources().getDisplayMetrics().density);
                  b.setPadding(p, p, p, p);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 6, 0, 6);
                  b.setLayoutParams(lp);
                  b.setOnClickListener(v -> action.run());
                  menuLayout.addView(b);
              }

              // ---------------- Garaj ----------------

              private void openGarage() {
                  menuLayout.removeAllViews();
                  msgText.setText("GARAJ\nAltin: " + Save.getGold(prefs));
                  final float d = getResources().getDisplayMetrics().density;

                  for (int i = 0; i < Cars.NAMES.length; i++) {
                      final int idx = i;
                      String label = Cars.NAMES[i];
                      if (Save.ownsCar(prefs, i)) {
                          label += " (Sahipsin)";
                          if (Save.getSelectedCar(prefs) == i) label += " *";
                      } else {
                          label += " - " + Cars.PRICES[i] + " altin";
                      }
                      TextView b = new TextView(this);
                      b.setText(label);
                      b.setTextColor(Color.WHITE);
                      b.setTextSize(16f);
                      b.setTypeface(Typeface.DEFAULT_BOLD);
                      b.setGravity(Gravity.CENTER);
                      b.setBackgroundColor(Save.ownsCar(prefs, i) ? 0xCC2E7D32 : 0xCC424242);
                      int p = (int) (12 * d);
                      b.setPadding(p, p, p, p);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, 4, 0, 4);
                      b.setLayoutParams(lp);
                      b.setOnClickListener(v -> {
                          if (Save.ownsCar(prefs, idx)) {
                              Save.selectCar(prefs, idx);
                              Toast.makeText(this, "Secildi!", Toast.LENGTH_SHORT).show();
                          } else if (Cars.canAfford(prefs, idx)) {
                              Save.spendGold(prefs, Cars.PRICES[idx]);
                              Save.unlockCar(prefs, idx);
                              Save.selectCar(prefs, idx);
                              Toast.makeText(this, "Satin alindi!", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(this, "Yeterli altinin yok!", Toast.LENGTH_SHORT).show();
                          }
                          openGarage();
                      });
                      menuLayout.addView(b);
                  }
                  addBackButton();
              }

              // ---------------- Modifiye ----------------

              private void openUpgrade() {
                  menuLayout.removeAllViews();
                  msgText.setText("MODIFIYE\nAltin: " + Save.getGold(prefs));
                  final float d = getResources().getDisplayMetrics().density;

                  String[] names = {"Motor (hiz)", "Fren (donus)", "Nitro Kapasitesi", "Zirh"};
                  int[] prices = {300, 250, 400, 350};

                  for (int i = 0; i < names.length; i++) {
                      final int idx = i;
                      int lvl = Save.getUpgrade(prefs, i);
                      String label = names[i] + "  [Seviye " + lvl + "/" + Save.MAX_UPGRADE + "]";
                      if (lvl < Save.MAX_UPGRADE) {
                          label += "\nYukselt: " + (prices[i] * (lvl + 1)) + " altin";
                      } else {
                          label += "\nMAKSIMUM";
                      }
                      TextView b = new TextView(this);
                      b.setText(label);
                      b.setTextColor(Color.WHITE);
                      b.setTextSize(15f);
                      b.setGravity(Gravity.CENTER);
                      b.setBackgroundColor(lvl >= Save.MAX_UPGRADE ? 0xCC1B5E20 : 0xCC00695C);
                      int p = (int) (12 * d);
                      b.setPadding(p, p, p, p);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(0, 6, 0, 6);
                      b.setLayoutParams(lp);
                      b.setOnClickListener(v -> {
                          int cur = Save.getUpgrade(prefs, idx);
                          if (cur >= Save.MAX_UPGRADE) {
                              Toast.makeText(this, "Zaten maksimum!", Toast.LENGTH_SHORT).show();
                              return;
                          }
                          int cost = prices[idx] * (cur + 1);
                          if (Save.spendGold(prefs, cost)) {
                              Save.setUpgrade(prefs, idx, cur + 1);
                              Toast.makeText(this, "Yukseltildi!", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(this, "Yeterli altinin yok!", Toast.LENGTH_SHORT).show();
                          }
                          openUpgrade();
                      });
                      menuLayout.addView(b);
                  }
                  addBackButton();
              }

              // ---------------- Skor Tablosu ----------------

              private void openScoreboard() {
                  menuLayout.removeAllViews();
                  msgText.setText("SKOR TABLOSU");
                  final float d = getResources().getDisplayMetrics().density;

                  int[] scores = Save.getScores(prefs);
                  String[] names = Save.getScoreNames(prefs);
                  int[] modes = Save.getScoreModes(prefs);
                  String[] modeName = {"Sonsuz", "Zaman", "Polis"};

                  for (int i = 0; i < Save.MAX_SCORES; i++) {
                      TextView row = new TextView(this);
                      String s = (i + 1) + ". " + names[i] + "  -  " + scores[i] + " m";
                      if (scores[i] > 0) s += "  [" + modeName[modes[i]] + "]";
                      row.setText(s);
                      row.setTextColor(scores[i] > 0 ? 0xFFFFEB3B : 0xFF888888);
                      row.setTextSize(16f);
                      row.setGravity(Gravity.CENTER);
                      row.setPadding(0, (int)(8*d), 0, (int)(8*d));
                      menuLayout.addView(row);
                  }
                  addBackButton();
              }

              private void addBackButton() {
                  addButton("<< GERI", 0xCCB71C1C, this::showMainMenu);
              }

              private void changeName() {
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("Yeni isim");
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_TEXT);
                  et.setText(Save.getName(prefs));
                  b.setView(et);
                  b.setPositiveButton("TAMAM", (d, w) -> {
                      Save.setName(prefs, et.getText().toString());
                      showMainMenu();
                  });
                  b.setNegativeButton("IPTAL", null);
                  b.show();
              }

              // ---------------- Oyun başlat ----------------

              private void startGame() {
                  renderer.mode = selectedMode;
                  renderer.configureForPlayer(
                          Save.getSelectedCar(prefs),
                          Save.getUpgrade(prefs, 0),
                          Save.getUpgrade(prefs, 1),
                          Save.getUpgrade(prefs, 2),
                          Save.getUpgrade(prefs, 3)
                  );
                  renderer.startGame();
                  scoreText.setVisibility(View.VISIBLE);
                  msgText.setVisibility(View.GONE);
                  updateHud();
              }

              // ---------------- HUD ----------------

              private void updateHud() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("Altin: ").append(Save.getGold(prefs));
                  if (renderer.state == GameRenderer.PLAYING) {
                      sb.append("  +").append(renderer.runGold);
                      if (renderer.mode == GameRenderer.MODE_TIME_TRIAL) {
                          sb.append("\nSure: ").append((int) renderer.timeLeft).append(" sn");
                      }
                      if (renderer.nitroTime > 0f) sb.append("\nNITRO!");
                      if (renderer.shieldTime > 0f) sb.append("\nKALKAN!");
                      if (renderer.slowmoTime > 0f) sb.append("\nYAVAS!");
                      if (renderer.magnetTime > 0f) sb.append("\nMIKNATIS!");
                      if (renderer.doubleGoldTime > 0f) sb.append("\n2X ALTIN!");
                  }
                  hudText.setText(sb.toString());
              }

              // ---------------- Listener ----------------

              @Override
              public void onScore(final int score) {
                  runOnUiThread(() -> scoreText.setText(score + " m"));
              }

              @Override
              public void onState(final int state, final int score) {
                  if (state == GameRenderer.DEAD) {
                      int earned = renderer.runGold + score / 20;
                      Save.addGold(prefs, earned);
                      int rank = Save.addScore(prefs, Save.getName(prefs), score, renderer.mode);
                      if (rank == 0) onHaptic(1);
                  }
                  runOnUiThread(() -> {
                      updateHud();
                      if (state == GameRenderer.PLAYING) {
                          msgText.setVisibility(View.GONE);
                          scoreText.setText("0 m");
                      } else if (state == GameRenderer.DEAD) {
                          int earned = renderer.runGold + score / 20;
                          String s = "OYUN BITTI!\n\nMesafe: " + score + " m"
                                  + "\nToplanan altin: " + renderer.runGold
                                  + "\nBonus: " + (score / 20)
                                  + "\nToplam: +" + earned + " altin"
                                  + "\n\nMenuye donmek icin dokun";
                          msgText.setText(s);
                          msgText.setVisibility(View.VISIBLE);
                      }
                  });
              }

              @Override
              public void onCheckpoint(final int count, final float timeLeft) {
                  onHaptic(1);
                  runOnUiThread(() -> {
                      msgText.setText("CHECKPOINT " + count + "!\n+" + (int) timeLeft + " sn");
                      msgText.setVisibility(View.VISIBLE);
                      msgText.postDelayed(() -> {
                          if (renderer.state == GameRenderer.PLAYING)
                              msgText.setVisibility(View.GONE);
                      }, 1200);
                  });
              }

              @Override
              public void onPowerUp(int type) {
                  onHaptic(0);
                  runOnUiThread(this::updateHud);
              }

              @Override
              public void onHaptic(final int strength) {
                  if (vib == null || !vib.hasVibrator()) return;
                  long ms = strength == 0 ? 20 : strength == 1 ? 60 : 150;
                  if (Build.VERSION.SDK_INT >= 26) {
                      vib.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                  } else {
                      vib.vibrate(ms);
                  }
              }

              @Override
              public void onReturnToMenu() {
                  runOnUiThread(this::showMainMenu);
              }

              // ---------------- Sistem UI ----------------

              @SuppressWarnings("deprecation")
              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUi();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  glView.onResume();
                  hideSystemUi();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  glView.onPause();
                  renderer.steer = 0f;
              }
          }
