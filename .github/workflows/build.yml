              public void startGame() {
                  for (int i = 0; i < MAX_OBS; i++) oAct[i] = false;
                  for (int i = 0; i < MAX_PU; i++) puAct[i] = false;
                  for (int i = 0; i < MAX_COIN; i++) coinAct[i] = false;
                  for (int i = 0; i < MAX_PARTS; i++) partAct[i] = false;
                  dist = 0f;
                  px = 0f;
                  vx = 0f;
                  spin = 0f;
                  crashT = 0f;
                  nextRow = 0f;
                  safeLane = 1;
                  speed = START_SPEED;
