              void step(float dt) {
                  time += dt;
                  if (tapReq) { tapReq = false; handleTap(); }

                  // Hız
                  if (state == READY) {
                      speed = 10f;
                  } else if (state == PLAYING) {
                      float target = Math.min(MAX_SPEED, START_SPEED + dist / 60f);
                      target *= speedMult;
                      if (nitroTime > 0f) target *= 1.6f;
                      if (slowmoTime > 0f) target *= 0.55f;
                      speed = target;
                  } else {
                      speed *= (float) Math.exp(-2.5f * dt);
                      crashT += dt;
                  }
                  scroll += speed * dt;

                  // Efekt süreleri
                  if (nitroTime > 0f) nitroTime -= dt;
                  if (shieldTime > 0f) shieldTime -= dt;
                  if (slowmoTime > 0f) slowmoTime -= dt;
                  if (magnetTime > 0f) magnetTime -= dt;
                  if (doubleGoldTime > 0f) doubleGoldTime -= dt;

                  // Direksiyon
                  if (state != DEAD) {
                      float target = steer * MAX_LAT * turnMult;
                      vx += (target - vx) * Math.min(1f, 12f * dt);
                      px += vx * dt;
                      if (px > MAX_X) { px = MAX_X; if (vx > 0f) vx = 0f; }
                      else if (px < -MAX_X) { px = -MAX_X; if (vx < 0f) vx = 0f; }
                  } else {
                      vx *= (float) Math.exp(-4f * dt);
                      spin += spinDir * 600f * (float) Math.exp(-3f * crashT) * dt;
                  }

                  // Mesafe ve üretim
                  if (state == PLAYING) {
                      dist += speed * dt;

                      if (mode == MODE_TIME_TRIAL) {
                          timeLeft -= dt;
                          if (timeLeft <= 0f) { crash(); return; }
                          if (dist >= nextCheckpoint) {
                              checkpointsPassed++;
                              timeLeft += 15f;
                              nextCheckpoint += 500f;
                              if (listener != null) listener.onCheckpoint(checkpointsPassed, timeLeft);
                          }
                      }

                      float diff = Math.min(1f, dist / 4000f);

                      nextRow -= speed * dt;
                      if (nextRow <= 0f) {
                          spawnRow(diff);
                          nextRow = Math.max(16f - diff * 6f, speed * (0.9f - diff * 0.3f))
                                  + rnd.nextFloat() * (8f - diff * 4f);
                      }

                      if (rnd.nextFloat() < 0.20f) spawnPowerUp();
                      if (rnd.nextFloat() < 0.70f) spawnCoinLine();
                  }

                  // Engelleri güncelle
                  if (state != READY) {
                      for (int i = 0; i < MAX_OBS; i++) {
                          if (!oAct[i]) continue;
                          // Karşıdan gelen araba bizim hızımıza ek olarak kendi hızıyla da gelir
                          float rel = oDir[i] < 0 ? (speed + oSpeed[i]) : (speed - oSpeed[i]);
                          oZ[i] += rel * dt;
                          if (oZ[i] - OB_D[oType[i]] * 0.5f > 12f) oAct[i] = false;
                      }
                  }

                  // Power-up'lar
                  for (int i = 0; i < MAX_PU; i++) {
                      if (!puAct[i]) continue;
                      puZ[i] += speed * dt;
                      puSpin[i] += dt * 3f;
                      if (state == PLAYING
                              && Math.abs(px - puX[i]) < 1.0f
                              && Math.abs(puZ[i]) < 1.5f) {
                          applyPowerUp(puType[i]);
                          puAct[i] = false;
                      }
                      if (puZ[i] > 12f) puAct[i] = false;
                  }

                  // Altın toplama (mıknatıs varsa daha geniş menzil)
                  float coinRangeX = magnetTime > 0f ? 3.5f : 0.9f;
                  float coinRangeZ = magnetTime > 0f ? 4.5f : 1.2f;
                  for (int i = 0; i < MAX_COIN; i++) {
                      if (!coinAct[i]) continue;
                      coinZ[i] += speed * dt;
                      coinSpin[i] += dt * 5f;
                      if (state == PLAYING
                              && Math.abs(px - coinX[i]) < coinRangeX
                              && Math.abs(coinZ[i]) < coinRangeZ) {
                          coinAct[i] = false;
                          int gain = doubleGoldTime > 0f ? 2 : 1;
                          runGold += gain;
                          spawnSparkles(coinX[i], 0.8f, coinZ[i], 8, 1f, 0.85f, 0.1f);
                      }
                      if (coinZ[i] > 12f) coinAct[i] = false;
                  }

                  // Çarpışma (kalkan yoksa)
                  if (state == PLAYING && shieldTime <= 0f) {
                      for (int i = 0; i < MAX_OBS; i++) {
                          if (!oAct[i]) continue;
                          if (Math.abs(px - oX[i]) < PLAYER_HALF_W + OB_W[oType[i]] * 0.5f
                                  && Math.abs(oZ[i]) < PLAYER_HALF_L + OB_D[oType[i]] * 0.5f) {
                              crash();
                              break;
                          }
                      }
                  }

                  // Parçacıkları güncelle
                  for (int i = 0; i < MAX_PARTS; i++) {
                      if (!partAct[i]) continue;
                      partLife[i] -= dt;
                      if (partLife[i] <= 0f) { partAct[i] = false; continue; }
                      partX[i] += partVX[i] * dt;
                      partY[i] += partVY[i] * dt;
                      partZ[i] += partVZ[i] * dt;
                      partVY[i] -= 9.8f * dt;
                      if (partY[i] < 0.05f) { partY[i] = 0.05f; partVY[i] *= -0.4f; partVX[i] *= 0.7f; partVZ[i] *= 0.7f; }
                  }

