              int score() { return (int) (dist / 2f); }

              private void crash() {
                  state = DEAD;
                  crashT = 0f;
                  spinDir = rnd.nextBoolean() ? 1f : -1f;
                  // Kıvılcım yağmuru
                  spawnSparkles(px, 0.5f, 0f, 40, 1f, 0.7f, 0.15f);
                  spawnSparkles(px, 0.6f, 0.3f, 20, 1f, 0.9f, 0.4f);
                  if (listener != null) listener.onHaptic(2);
                  if (listener != null) listener.onState(DEAD, score());
              }

              private void applyPowerUp(int type) {
                  switch (type) {
                      case PU_NITRO: nitroTime = nitroCapacity; break;
                      case PU_SHIELD: shieldTime = shieldCapacity; break;
                      case PU_SLOWMO: slowmoTime = 4.0f; break;
                      case PU_MAGNET: magnetTime = 6.0f; break;
                      case PU_DOUBLE_GOLD: doubleGoldTime = 8.0f; break;
                  }
                  if (listener != null) listener.onPowerUp(type);
              }

              // ============================================================
              //  ÜRETİM
              // ============================================================

              private void spawnRow(float diff) {
                  int lane = safeLane + (rnd.nextInt(3) - 1);
                  if (lane < 0) lane = 0;
                  if (lane > 2) lane = 2;
                  safeLane = lane;

                  boolean both = rnd.nextFloat() < (0.25f + diff * 0.55f);
                  int single = -1;
                  if (!both) {
                      single = rnd.nextInt(2);
                      if (single >= safeLane) single++;
                  }
                  for (int l = 0; l < 3; l++) {
                      if (l == safeLane) continue;
                      if (!both && l != single) continue;
                      int type = pickObstacleType(diff);
                      addObstacle((l - 1) * LANE_W, type);
                  }
              }

              private int pickObstacleType(float diff) {
                  float r = rnd.nextFloat();
                  // Engel tipi ağırlıkları (zorlukla birlikte değişir)
                  // Bariyer çok, kamyon zorlukla artar
                  if (r < 0.28f) return 0;             // bariyer
                  if (r < 0.45f) return 1;             // koni
                  if (r < 0.62f) return 2;             // varil
                  if (r < 0.62f + diff * 0.25f) return 3;  // kamyon
                  return 4;                            // direk
              }

              private void addObstacle(float x, int type) {
                  for (int i = 0; i < MAX_OBS; i++) {
                      if (oAct[i]) continue;
                      oAct[i] = true;
                      oX[i] = x;
                      oZ[i] = SPAWN_Z;
                      oType[i] = type;
                      oCol[i] = rnd.nextInt(CAR_COLORS.length);
                      // Karşıdan gelen araç: %50 olasılıkla trafik arabası tipi 1 ise ters yönde gelsin
                      if (type == 1 || type == 2) {
                          // koni ve varil hep aynı yönde (sabit engel)
                          oDir[i] = +1;
                          oSpeed[i] = 0f;
                      } else {
                          // bariyer ve kamyon trafik olabilir
                          oDir[i] = rnd.nextBoolean() ? -1 : +1;
                          oSpeed[i] = 3f + rnd.nextFloat() * 6f;
                      }
                      return;
                  }
              }

              private void spawnPowerUp() {
                  for (int i = 0; i < MAX_PU; i++) {
                      if (puAct[i]) continue;
                      puAct[i] = true;
                      int lane = rnd.nextInt(3);
                      if (lane == safeLane) lane = (lane + 1) % 3;
                      puX[i] = (lane - 1) * LANE_W;
                      puZ[i] = SPAWN_Z;
                      puType[i] = rnd.nextInt(PU_COUNT);
                      puSpin[i] = rnd.nextFloat() * 6.28f;
                      return;
                  }
              }

              private void spawnCoinLine() {
                  int lane = rnd.nextInt(3);
                  if (lane == safeLane) lane = (lane + 1) % 3;
                  float x = (lane - 1) * LANE_W;
                  int count = 1 + rnd.nextInt(3);
                  float z = SPAWN_Z;
                  for (int c = 0; c < count; c++) {
                      boolean placed = false;
                      for (int i = 0; i < MAX_COIN; i++) {
                          if (coinAct[i]) continue;
                          coinAct[i] = true;
                          coinX[i] = x;
                          coinZ[i] = z;
                          coinSpin[i] = rnd.nextFloat() * 6.28f;
                          placed = true;
                          break;
                      }
                      if (!placed) return;
                      z += 4f;
                  }
              }

              // ============================================================
              //  PARÇACIK (KIVILCIM)
              // ============================================================

              private void spawnSparkles(float x, float y, float z, int count,
                                         float cr, float cg, float cb) {
                  for (int n = 0; n < count; n++) {
                      for (int i = 0; i < MAX_PARTS; i++) {
                          if (partAct[i]) continue;
                          partAct[i] = true;
                          partX[i] = x + (rnd.nextFloat() - 0.5f) * 0.5f;
                          partY[i] = y + rnd.nextFloat() * 0.5f;
                          partZ[i] = z + (rnd.nextFloat() - 0.5f) * 0.5f;
                          partVX[i] = (rnd.nextFloat() - 0.5f) * 8f;
                          partVY[i] = rnd.nextFloat() * 6f + 2f;
                          partVZ[i] = (rnd.nextFloat() - 0.5f) * 8f;
                          partLife[i] = 0.4f + rnd.nextFloat() * 0.7f;
                          partCol[i * 3] = cr * (0.7f + rnd.nextFloat() * 0.3f);
                          partCol[i * 3 + 1] = cg * (0.7f + rnd.nextFloat() * 0.3f);
                          partCol[i * 3 + 2] = cb * (0.7f + rnd.nextFloat() * 0.3f);
                          break;
                      }
                  }
              }

              // ============================================================
              //  SHADER
              // ============================================================

              private static final String VERTEX_SRC =
                      "attribute vec3 aPos;\n" +
                      "attribute vec3 aNormal;\n" +
                      "uniform mat4 uMVP;\n" +
                      "uniform mat4 uModel;\n" +
                      "uniform vec3 uLight;\n" +
                      "uniform float uFogStart;\n" +
                      "uniform float uFogEnd;\n" +
                      "varying float vLight;\n" +
                      "varying float vFog;\n" +
                      "void main() {\n" +
                      "  vec3 n = normalize((uModel * vec4(aNormal, 0.0)).xyz);\n" +
                      "  vLight = 0.45 + 0.55 * max(dot(n, normalize(uLight)), 0.0);\n" +
                      "  gl_Position = uMVP * vec4(aPos, 1.0);\n" +
                      "  vFog = clamp((gl_Position.w - uFogStart) / (uFogEnd - uFogStart), 0.0, 1.0);\n" +
                      "}\n";

              private static final String FRAGMENT_SRC =
                      "precision mediump float;\n" +
                      "varying float vLight;\n" +
                      "varying float vFog;\n" +
                      "uniform vec4 uColor;\n" +
                      "uniform vec3 uFogColor;\n" +
                      "uniform float uGlow;\n" +
                      "void main() {\n" +
                      "  vec3 c = uColor.rgb * mix(vLight, 1.0, uGlow);\n" +
                      "  c = mix(c, uFogColor, vFog);\n" +
                      "  gl_FragColor = vec4(c, 1.0);\n" +
                      "}\n";

              @Override
              public void onSurfaceCreated(GL10 gl, EGLConfig config) {
                  lastNanos = 0L;
                  program = createProgram(VERTEX_SRC, FRAGMENT_SRC);
                  aPos = GLES20.glGetAttribLocation(program, "aPos");
                  aNormal = GLES20.glGetAttribLocation(program, "aNormal");
                  uMVP = GLES20.glGetUniformLocation(program, "uMVP");
                  uModel = GLES20.glGetUniformLocation(program, "uModel");
                  uColor = GLES20.glGetUniformLocation(program, "uColor");
                  uGlow = GLES20.glGetUniformLocation(program, "uGlow");
                  uLight = GLES20.glGetUniformLocation(program, "uLight");
                  uFogColor = GLES20.glGetUniformLocation(program, "uFogColor");
                  uFogStart = GLES20.glGetUniformLocation(program, "uFogStart");
                  uFogEnd = GLES20.glGetUniformLocation(program, "uFogEnd");
                  buildCube();
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST);
              }

              @Override
              public void onSurfaceChanged(GL10 gl, int width, int height) {
                  GLES20.glViewport(0, 0, width, height);
                  aspect = (float) width / (float) Math.max(1, height);
              }

              @Override
              public void onDrawFrame(GL10 gl) {
                  long now = System.nanoTime();
                  float dt = lastNanos == 0L ? 0f : (now - lastNanos) / 1e9f;
                  lastNanos = now;
                  if (dt > 0.05f) dt = 0.05f;
                  step(dt);
                  render();
              }

              // ============================================================
              //  ÇİZİM
              // ============================================================

              private void buildCube() {
                  float[] v = {
                          0.5f, -0.5f, -0.5f, 1, 0, 0,   0.5f, 0.5f, -0.5f, 1, 0, 0,
                          0.5f, 0.5f, 0.5f, 1, 0, 0,     0.5f, -0.5f, 0.5f, 1, 0, 0,
                          -0.5f, -0.5f, 0.5f, -1, 0, 0,  -0.5f, 0.5f, 0.5f, -1, 0, 0,
                          -0.5f, 0.5f, -0.5f, -1, 0, 0,  -0.5f, -0.5f, -0.5f, -1, 0, 0,
                          -0.5f, 0.5f, -0.5f, 0, 1, 0,   -0.5f, 0.5f, 0.5f, 0, 1, 0,
                          0.5f, 0.5f, 0.5f, 0, 1, 0,     0.5f, 0.5f, -0.5f, 0, 1, 0,
                          -0.5f, -0.5f, 0.5f, 0, -1, 0,  -0.5f, -0.5f, -0.5f, 0, -1, 0,
                          0.5f, -0.5f, -0.5f, 0, -1, 0,  0.5f, -0.5f, 0.5f, 0, -1, 0,
                          -0.5f, -0.5f, 0.5f, 0, 0, 1,   0.5f, -0.5f, 0.5f, 0, 0, 1,
                          0.5f, 0.5f, 0.5f, 0, 0, 1,     -0.5f, 0.5f, 0.5f, 0, 0, 1,
                          0.5f, -0.5f, -0.5f, 0, 0, -1,  -0.5f, -0.5f, -0.5f, 0, 0, -1,
                          -0.5f, 0.5f, -0.5f, 0, 0, -1,  0.5f, 0.5f, -0.5f, 0, 0, -1
                  };
                  short[] idx = new short[36];
                  for (int f = 0; f < 6; f++) {
                      int o = f * 4;
                      idx[f * 6] = (short) o;
                      idx[f * 6 + 1] = (short) (o + 1);
                      idx[f * 6 + 2] = (short) (o + 2);
                      idx[f * 6 + 3] = (short) o;
                      idx[f * 6 + 4] = (short) (o + 2);
                      idx[f * 6 + 5] = (short) (o + 3);
                  }
                  vertexBuf = ByteBuffer.allocateDirect(v.length * 4).order(ByteOrder.nativeOrder()).asFloatBuffer();
                  vertexBuf.put(v).position(0);
                  indexBuf = ByteBuffer.allocateDirect(idx.length * 2).order(ByteOrder.nativeOrder()).asShortBuffer();
                  indexBuf.put(idx).position(0);
              }

              private void box(float[] b, float lx, float ly, float lz,
                               float sx, float sy, float sz,
                               float r, float g, float bl, float glow) {
                  System.arraycopy(b, 0, model, 0, 16);
                  Matrix.translateM(model, 0, lx, ly, lz);
                  Matrix.scaleM(model, 0, sx, sy, sz);
                  Matrix.multiplyMM(mvp, 0, vp, 0, model, 0);
                  GLES20.glUniformMatrix4fv(uMVP, 1, false, mvp, 0);
                  GLES20.glUniformMatrix4fv(uModel, 1, false, model, 0);
                  GLES20.glUniform4f(uColor, r, g, bl, 1f);
                  GLES20.glUniform1f(uGlow, glow);
                  GLES20.glDrawElements(GLES20.GL_TRIANGLES, 36, GLES20.GL_UNSIGNED_SHORT, indexBuf);
              }

              private void render() {
                  if (program == 0) return;

                  GLES20.glClearColor(FOG_R, FOG_G, FOG_B, 1f);
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT | GLES20.GL_DEPTH_BUFFER_BIT);
                  GLES20.glUseProgram(program);

                  float fov = (float) Math.toDegrees(2.0 * Math.atan(3.6 / (8.5 * aspect)));
                  if (fov < 55f) fov = 55f;
                  if (fov > 95f) fov = 95f;
                  fov += Math.max(0f, (speed - START_SPEED)) * 0.2f;
                  Matrix.perspectiveM(proj, 0, fov, aspect, 0.1f, 200f);

                  float shake = state == DEAD ? 0.35f * (float) Math.exp(-5f * crashT) : 0f;
                  float cx = px * 0.6f + (float) Math.sin(time * 70f) * shake;
                  float cy = 4.0f + (float) Math.cos(time * 83f) * shake * 0.6f;
                  Matrix.setLookAtM(view, 0, cx, cy, 8.0f, cx, 0.5f, -10f, 0f, 1f, 0f);
                  Matrix.multiplyMM(vp, 0, proj, 0, view, 0);

                  GLES20.glUniform3f(uLight, 0.4f, 1.0f, 0.6f);
                  GLES20.glUniform3f(uFogColor, FOG_R, FOG_G, FOG_B);
                  GLES20.glUniform1f(uFogStart, 45f);
                  GLES20.glUniform1f(uFogEnd, 150f);

                  vertexBuf.position(0);
                  GLES20.glVertexAttribPointer(aPos, 3, GLES20.GL_FLOAT, false, 24, vertexBuf);
                  GLES20.glEnableVertexAttribArray(aPos);
                  vertexBuf.position(3);
                  GLES20.glVertexAttribPointer(aNormal, 3, GLES20.GL_FLOAT, false, 24, vertexBuf);
                  GLES20.glEnableVertexAttribArray(aNormal);
                  indexBuf.position(0);

                  drawEnvironment();
                  drawObstacles();
                  drawPowerUps();
                  drawCoins();
                  drawPlayer();
                  drawParticles();
              }

              private void drawEnvironment() {
                  final float gp = 10f;
                  float off = scroll % gp;
                  int f = (int) (scroll / gp);
                  for (int i = -1; i <= 18; i++) {
                      boolean a = (((i + f) & 1) == 0);
                      float z = -i * gp + off;
                      if (a) box(ident, 0, -0.1f, z, 120f, 0.2f, gp, 0.30f, 0.62f, 0.30f, 0f);
                      else box(ident, 0, -0.1f, z, 120f, 0.2f, gp, 0.26f, 0.56f, 0.27f, 0f);
                  }
                  box(ident, 0, 0f, -90f, 6.6f, 0.2f, 220f, 0.22f, 0.23f, 0.26f, 0f);
                  box(ident, -3.0f, 0.12f, -90f, 0.12f, 0.04f, 220f, 0.95f, 0.95f, 0.95f, 0f);
                  box(ident, 3.0f, 0.12f, -90f, 0.12f, 0.04f, 220f, 0.95f, 0.95f, 0.95f, 0f);

                  final float dp = 8f;
                  off = scroll % dp;
                  for (int i = -1; i < 17; i++) {
                      float z = -i * dp + off;
                      box(ident, -1.1f, 0.12f, z, 0.14f, 0.04f, 3f, 0.95f, 0.95f, 0.85f, 0f);
                      box(ident, 1.1f, 0.12f, z, 0.14f, 0.04f, 3f, 0.95f, 0.95f, 0.85f, 0f);
                  }
                  final float cp = 4f;
                  off = scroll % cp;
                  f = (int) (scroll / cp);
                  for (int i = -2; i < 32; i++) {
                      boolean a = (((i + f) & 1) == 0);
                      float z = -i * cp + off;
                      float r = a ? 0.88f : 0.95f;
                      float g = a ? 0.15f : 0.95f;
                      float b = a ? 0.15f : 0.95f;
                      box(ident, -3.45f, 0.05f, z, 0.35f, 0.2f, cp, r, g, b, 0f);
                      box(ident, 3.45f, 0.05f, z, 0.35f, 0.2f, cp, r, g, b, 0f);
                  }
                  final float tp = 14f;
                  off = scroll % tp;
                  f = (int) (scroll / tp);
                  for (int i = -1; i < 11; i++) {
                      int id = i + f;
                      float z = -i * tp + off;
                      for (int s = -1; s <= 1; s += 2) {
                          int h = ((id * 73856093) ^ (s * 19349663)) >>> 3;
                          h &= 0xFF;
                          if (h % 5 == 0) continue;
                          float x = s * (5.8f + (h % 3) * 1.7f);
                          float th = 1.0f + (h % 4) * 0.35f;
                          box(ident, x, th * 0.5f, z, 0.3f, th, 0.3f, 0.45f, 0.30f, 0.15f, 0f);
                          box(ident, x, th + 0.8f, z, 1.5f, 1.6f, 1.5f, 0.15f, 0.45f + (h % 3) * 0.05f, 0.18f, 0f);
                      }
                  }
              }

              private void drawObstacles() {
                  for (int i = 0; i < MAX_OBS; i++) {
                      if (!oAct[i]) continue;
                      Matrix.setIdentityM(base, 0);
                      Matrix.translateM(base, 0, oX[i], 0f, oZ[i]);
                      // Karşıdan gelen araç için 180° döndür
                      if (oDir[i] < 0) Matrix.rotateM(base, 0, 180f, 0f, 1f, 0f);
                      switch (oType[i]) {
                          case 0: drawBarrier(base); break;
                          case 1: drawCone(base); break;
                          case 2: drawBarrel(base); break;
                          case 3: drawTruck(base, CAR_COLORS[oCol[i]]); break;
                          default: drawPole(base); break;
                      }
                  }
              }

              private void drawBarrier(float[] b) {
                  box(b, -0.8f, 0.3f, 0f, 0.12f, 0.6f, 0.12f, 0.35f, 0.35f, 0.38f, 0f);
                  box(b, 0.8f, 0.3f, 0f, 0.12f, 0.6f, 0.12f, 0.35f, 0.35f, 0.38f, 0f);
                  box(b, 0f, 0.8f, 0f, 1.9f, 0.5f, 0.14f, 0.96f, 0.96f, 0.96f, 0f);
                  for (int k = 0; k < 4; k++) {
                      box(b, -0.72f + k * 0.48f, 0.8f, 0f, 0.24f, 0.5f, 0.16f, 0.88f, 0.12f, 0.12f, 0f);
                  }
              }

              private void drawCone(float[] b) {
                  box(b, 0f, 0.05f, 0f, 0.6f, 0.1f, 0.6f, 0.15f, 0.15f, 0.15f, 0f);
                  box(b, 0f, 0.35f, 0f, 0.45f, 0.55f, 0.45f, 1.0f, 0.45f, 0.05f, 0f);
                  box(b, 0f, 0.30f, 0f, 0.5f, 0.12f, 0.5f, 1.0f, 1.0f, 1.0f, 0f);
                  box(b, 0f, 0.20f, 0f, 0.53f, 0.12f, 0.53f, 1.0f, 1.0f, 1.0f, 0f);
              }

              private void drawBarrel(float[] b) {
                  box(b, 0f, 0.5f, 0f, 0.9f, 1.0f, 0.9f, 0.85f, 0.20f, 0.10f, 0f);
                  box(b, 0f, 0.3f, 0f, 0.92f, 0.12f, 0.92f, 1f, 0.8f, 0.1f, 0f);
                  box(b, 0f, 0.7f, 0f, 0.92f, 0.12f, 0.92f, 1f, 0.8f, 0.1f, 0f);
              }

              private void drawTruck(float[] b, float[] c) {
                  // Büyük kamyon: 2.4x2.4
                  box(b, 0f, 0.6f, 0f, 2.2f, 1.2f, 2.4f, c[0], c[1], c[2], 0f);
                  box(b, 0f, 1.4f, 0f, 2.0f, 0.4f, 2.2f, 0.9f, 0.9f, 0.9f, 0f);
                  // Kabin
                  box(b, 0f, 1.7f, -1.0f, 1.8f, 0.6f, 0.6f, 0.15f, 0.15f, 0.2f, 0f);
                  // Farlar
                  box(b, -0.7f, 1.7f, -1.31f, 0.35f, 0.3f, 0.05f, 1f, 0.95f, 0.6f, 1f);
                  box(b, 0.7f, 1.7f, -1.31f, 0.35f, 0.3f, 0.05f, 1f, 0.95f, 0.6f, 1f);
                  // Tekerlekler
                  for (int sx = -1; sx <= 1; sx += 2)
                      for (int sz = -1; sz <= 1; sz += 2)
                          box(b, sx * 1.1f, 0.3f, sz * 0.8f, 0.25f, 0.6f, 0.7f, 0.06f, 0.06f, 0.06f, 0f);
              }

              private void drawPole(float[] b) {
                  box(b, 0f, 1.0f, 0f, 0.2f, 2.0f, 0.2f, 0.4f, 0.4f, 0.45f, 0f);
                  box(b, 0f, 2.0f, 0f, 1.0f, 0.15f, 0.15f, 0.4f, 0.4f, 0.45f, 0f);
                  // Kırmızı uyarı bandı
                  box(b, 0f, 0.5f, 0f, 0.24f, 0.2f, 0.24f, 1f, 0.2f, 0.2f, 0f);
              }

              private void drawPowerUps() {
                  for (int i = 0; i < MAX_PU; i++) {
                      if (!puAct[i]) continue;
                      float[] c = PU_COLORS[puType[i]];
                      Matrix.setIdentityM(base, 0);
                      Matrix.translateM(base, 0, puX[i], 0.9f, puZ[i]);
                      Matrix.rotateM(base, 0, puSpin[i] * 57.3f, 0f, 1f, 0f);
                      Matrix.rotateM(base, 0, 35f, 1f, 0f, 0f);
                      box(base, 0f, 0f, 0f, 1.1f, 1.1f, 1.1f,
                              c[0] * 0.5f, c[1] * 0.5f, c[2] * 0.5f, 0.8f);
                      box(base, 0f, 0f, 0f, 0.7f, 0.7f, 0.7f, c[0], c[1], c[2], 1f);
                  }
              }

              private void drawCoins() {
                  for (int i = 0; i < MAX_COIN; i++) {
                      if (!coinAct[i]) continue;
                      Matrix.setIdentityM(base, 0);
                      Matrix.translateM(base, 0, coinX[i], 0.7f, coinZ[i]);
                      Matrix.rotateM(base, 0, coinSpin[i] * 57.3f, 0f, 1f, 0f);
                      Matrix.rotateM(base, 0, 90f, 1f, 0f, 0f);
                      // Altın: parlak sarı, kalın silindir gibi görünsün
                      box(base, 0f, 0f, 0f, 0.7f, 0.7f, 0.15f, 1f, 0.85f, 0.1f, 1f);
                      box(base, 0f, 0f, 0f, 0.5f, 0.5f, 0.17f, 1f, 0.95f, 0.4f, 1f);
                  }
              }

              private void drawParticles() {
                  for (int i = 0; i < MAX_PARTS; i++) {
                      if (!partAct[i]) continue;
                      float life = partLife[i];
                      float scale = Math.max(0.04f, life * 0.3f);
                      float r = partCol[i * 3];
                      float g = partCol[i * 3 + 1];
                      float b = partCol[i * 3 + 2];
                      // Kıvılcım parlak
                      box(ident, partX[i], partY[i], partZ[i], scale, scale, scale, r, g, b, 1f);
                  }
              }

              private void drawPlayer() {
                  float yaw = -vx * 1.8f + spin;
                  float roll = state == DEAD ? Math.min(1f, crashT * 3f) * 18f * spinDir : 0f;
                  float hop = 0f;
                  if (state == DEAD) {
                      hop = Math.max(0f, (float) Math.sin(crashT * 9f)) * 0.6f * (float) Math.exp(-2f * crashT);
                  }

                  float r = carBody[0], g = carBody[1], b = carBody[2];

                  // Kalkan
                  if (shieldTime > 0f) {
                      float pulse = 0.7f + 0.3f * (float) Math.sin(time * 20f);
                      Matrix.setIdentityM(base, 0);
                      Matrix.translateM(base, 0, px, 0.5f, 0f);
                      box(base, 0f, 0f, 0f, 1.6f * pulse, 1.5f * pulse, 2.6f * pulse,
                              0.3f, 1f, 0.5f, 1f);
                  }
                  // Nitro alev
                  if (nitroTime > 0f) {
                      Matrix.setIdentityM(base, 0);
                      Matrix.translateM(base, 0, px, 0.45f, 1.15f);
                      float flame = 0.5f + 0.5f * (float) Math.sin(time * 30f);
                      box(base, 0f, 0f, 0f, 0.7f, 0.5f, 0.8f * flame,
                              1f, 0.55f + 0.3f * flame, 0.1f, 1f);
                  }
                  // Mıknatıs halkası
                  if (magnetTime > 0f) {
                      float rad = 2.5f + 0.3f * (float) Math.sin(time * 8f);
                      Matrix.setIdentityM(base, 0);
                      Matrix.translateM(base, 0, px, 0.15f, 0f);
                      box(base, rad, 0f, 0f, 0.15f, 0.15f, 0.15f, 1f, 0.55f, 0.85f, 1f);
                      box(base, -rad, 0f, 0f, 0.15f, 0.15f, 0.15f, 1f, 0.55f, 0.85f, 1f);
                      box(base, 0f, 0f, rad, 0.15f, 0.15f, 0.15f, 1f, 0.55f, 0.85f, 1f);
                      box(base, 0f, 0f, -rad, 0.15f, 0.15f, 0.15f, 1f, 0.55f, 0.85f, 1f);
                  }

                  // Gölge
                  Matrix.setIdentityM(base, 0);
                  Matrix.translateM(base, 0, px, 0f, 0f);
                  box(base, 0f, 0.105f, 0f, 1.25f, 0.02f, 2.3f, 0.10f, 0.10f, 0.12f, 0f);

                  Matrix.setIdentityM(base, 0);
                  Matrix.translateM(base, 0, px, hop, 0f);
                  Matrix.rotateM(base, 0, yaw, 0f, 1f, 0f);
                  Matrix.rotateM(base, 0, roll, 0f, 0f, 1f);

                  float dmg = state == DEAD ? Math.min(1f, crashT * 2f) : 0f;
                  float crumple = dmg * 0.25f;

                  // Gövde
                  box(base, 0f, 0.42f - crumple * 0.1f, 0f,
                          1.0f, 0.42f - crumple * 0.15f, 2.0f - crumple * 0.2f,
                          r, g, b, 0f);
                  // Kabin
                  box(base, 0f, 0.80f - crumple * 0.15f, 0.15f, 0.84f, 0.36f, 1.0f, 0.12f, 0.16f, 0.24f, 0f);
                  box(base, 0f, 1.00f - crumple * 0.15f, 0.15f, 0.80f, 0.05f, 0.95f, r*0.85f, g*0.85f, b*0.85f, 0f);
                  // Spoyler
                  box(base, -0.38f, 0.78f, 0.88f, 0.06f, 0.30f, 0.1f, 0.12f, 0.12f, 0.12f, 0f);
                  box(base, 0.38f, 0.78f, 0.88f, 0.06f, 0.30f, 0.1f, 0.12f, 0.12f, 0.12f, 0f);
                  box(base, 0f, 0.95f, 0.88f, 1.05f, 0.06f, 0.32f, 0.12f, 0.12f, 0.12f, 0f);
                  // Stop lambaları
                  float glow = state == DEAD ? 1f : 0.9f;
                  box(base, -0.34f, 0.55f, 1.01f, 0.24f, 0.12f, 0.05f, 1f, 0.15f, 0.15f, glow);
                  box(base, 0.34f, 0.55f, 1.01f, 0.24f, 0.12f, 0.05f, 1f, 0.15f, 0.15f, glow);
                  // Tekerlekler
                  for (int sx = -1; sx <= 1; sx += 2)
                      for (int sz = -1; sz <= 1; sz += 2)
                          box(base, sx * 0.52f, 0.18f, sz * 0.62f, 0.2f, 0.36f, 0.5f, 0.06f, 0.06f, 0.06f, 0f);
              }

              // ============================================================
              //  SHADER YARDIMCILARI
              // ============================================================

              private static int loadShader(int type, String src) {
                  int s = GLES20.glCreateShader(type);
                  GLES20.glShaderSource(s, src);
                  GLES20.glCompileShader(s);
                  int[] ok = new int[1];
                  GLES20.glGetShaderiv(s, GLES20.GL_COMPILE_STATUS, ok, 0);
                  if (ok[0] == 0) {
                      Log.e("RoadRush", "Shader hatasi: " + GLES20.glGetShaderInfoLog(s));
                      GLES20.glDeleteShader(s);
                      return 0;
                  }
                  return s;
              }

              private static int createProgram(String vs, String fs) {
                  int v = loadShader(GLES20.GL_VERTEX_SHADER, vs);
                  int f = loadShader(GLES20.GL_FRAGMENT_SHADER, fs);
                  if (v == 0 || f == 0) return 0;
                  int p = GLES20.glCreateProgram();
                  GLES20.glAttachShader(p, v);
                  GLES20.glAttachShader(p, f);
                  GLES20.glLinkProgram(p);
                  int[] ok = new int[1];
                  GLES20.glGetProgramiv(p, GLES20.GL_LINK_STATUS, ok, 0);
                  if (ok[0] == 0) {
                      Log.e("RoadRush", "Program hatasi: " + GLES20.glGetProgramInfoLog(p));
                      GLES20.glDeleteProgram(p);
                      return 0;
                  }
                  return p;
              }
          }
          EOF_RR

