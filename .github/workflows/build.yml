                      "varying float vLight;\n" +
                      "uniform vec4 uColor;\n" +
                      "uniform float uGlow;\n" +
                      "void main() {\n" +
                      "  vec3 c = uColor.rgb * mix(vLight, 1.0, uGlow);\n" +
                      "  gl_FragColor = vec4(c, 1.0);\n" +
