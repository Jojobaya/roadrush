                      if (lvl < Save.MAX_UPGRADE) {
                          int cost = prices[i] * (lvl + 1);
                          priceTxt.setText("Yukselt: " + cost + " altin");
                      } else {
                          priceTxt.setText("MAKSIMUM SEVIYE");
                      }
                      priceTxt.setTextColor(0xFFFFD54F);
                      priceTxt.setTextSize(13f);
                      row.addView(priceTxt);

                      row.setOnClickListener(v -> {
                          int cur = Save.getUpgrade(prefs, idx);
                          if (cur >= Save.MAX_UPGRADE) {
                              Toast.makeText(this, "Zaten maksimum!", Toast.LENGTH_SHORT).show();
                              return;
                          }
                          int cost = prices[idx] * (cur + 1);
                          if (Save.spendGold(prefs, cost)) {
                              Save.setUpgrade(prefs, idx, cur + 1);
                              Toast.makeText(this, "Yukseltildi!", Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(this, "Yeterli altinin yok!", Toast.LENGTH_SHORT).show();
                          }
                          openUpgrade();
                      });
                      menuLayout.addView(row);
                  }
                  addButton("<< GERI", R.drawable.btn_red, this::showMainMenu);
              }

              private void startGame() {
                  renderer.mode = selectedMode;
                  renderer.mapIdx = Save.getMap(prefs);
                  renderer.configureForPlayer(
                          Save.getSelectedCar(prefs),
                          Save.getUpgrade(prefs, 0),
                          Save.getUpgrade(prefs, 1),
                          Save.getUpgrade(prefs, 2),
                          Save.getUpgrade(prefs, 3)
                  );
                  renderer.startGame();
                  scoreText.setText("0 m");
                  if (selectedMode == GameRenderer.MODE_TIME_TRIAL) {
                      timeText.setVisibility(View.VISIBLE);
                      timeText.setText("⏱ 60 sn");
                  } else {
                      timeText.setVisibility(View.GONE);
                  }
                  showGameScene();
                  updateHud();
              }

              private void updateHud() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("💰 ").append(Save.getGold(prefs));
                  if (renderer.state == GameRenderer.PLAYING) {
                      sb.append("  +").append(renderer.runGold);
                      if (renderer.nitroTime > 0f) sb.append("\n🔥 NITRO");
                      if (renderer.shieldTime > 0f) sb.append("\n🛡 KALKAN");
                      if (renderer.slowmoTime > 0f) sb.append("\n🐢 YAVAS");
                      if (renderer.magnetTime > 0f) sb.append("\n🧲 MIKNATIS");
                      if (renderer.doubleGoldTime > 0f) sb.append("\n💰 2X ALTIN");
                  }
                  hudText.setText(sb.toString());
              }

              @Override
              public void onScore(final int score) {
                  runOnUiThread(() -> {
                      scoreText.setText(score + " m");
                      if (renderer.mode == GameRenderer.MODE_TIME_TRIAL && renderer.state == GameRenderer.PLAYING) {
                          int sec = (int) renderer.timeLeft;
                          if (sec < 0) sec = 0;
                          timeText.setText("⏱ " + sec + " sn");
                          if (sec <= 10) timeText.setTextColor(0xFFFF5252);
                          else timeText.setTextColor(0xFFFFEB3B);
                      }
                  });
              }

              @Override
              public void onState(final int state, final int score) {
                  if (state == GameRenderer.DEAD) {
                      int earned = renderer.runGold + score / 20;
                      Save.addGold(prefs, earned);
                      int rank = Save.addScore(prefs, Save.getName(prefs), score, renderer.mode);
                      if (rank == 0) onHaptic(1);
                  }
                  runOnUiThread(() -> {
                      updateHud();
                      if (state == GameRenderer.PLAYING) {
                          scoreText.setText("0 m");
                      }
                  });
              }

              @Override
              public void onCheckpoint(int count, float timeLeft) {
                  onHaptic(1);
              }

              @Override
              public void onPowerUp(int type) {
                  onHaptic(0);
                  runOnUiThread(() -> {
                      updateHud();
                      String msg;
                      switch (type) {
                          case GameRenderer.PU_NITRO: msg = "🔥 NITRO!"; break;
                          case GameRenderer.PU_SHIELD: msg = "🛡 KALKAN!"; break;
                          case GameRenderer.PU_SLOWMO: msg = "🐢 YAVAS!"; break;
                          case GameRenderer.PU_MAGNET: msg = "🧲 MIKNATIS!"; break;
                          case GameRenderer.PU_DOUBLE_GOLD: msg = "💰 2X ALTIN!"; break;
                          case GameRenderer.PU_TIME: msg = "⏱ +10 SANIYE!"; break;
                          default: msg = "POWER-UP!"; break;
                      }
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                  });
              }

              @Override
              public void onHaptic(final int strength) {
                  if (vib == null || !vib.hasVibrator()) return;
                  long ms = strength == 0 ? 20 : strength == 1 ? 60 : 150;
                  if (Build.VERSION.SDK_INT >= 26) {
                      vib.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                  } else {
                      vib.vibrate(ms);
                  }
              }

              @Override
              public void onReturnToMenu() {
                  runOnUiThread(this::showMainMenu);
              }

              @SuppressWarnings("deprecation")
              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUi();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  glView.onResume();
                  if (previewView != null) previewView.onResume();
                  hideSystemUi();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  glView.onPause();
                  if (previewView != null) previewView.onPause();
                  renderer.steer = 0f;
              }
          }
          EOF_RR

      - name: APK Oluştur
        run: cd RoadRush && gradle assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: RoadRush-APK-v5.1
          path: RoadRush/app/build/outputs/apk/debug/app-debug.apk